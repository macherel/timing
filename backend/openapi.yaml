openapi: 3.1.0
info:
  title: Timing API
  version: 1.0.0
  description: |
    HTTP API of the timing app, served by the backend under `/api` on the app's port (3001 by default).
    The frontend uses it for the race, live, diagnostics and configuration pages; instances of the app on the same
    network use the `/sync` routes between themselves.

    - Errors answer `{ "problems": ["…"] }` with a 4xx status: messages in English, to show as they are.
    - Instants are ISO 8601 in UTC. Run starts and finishes come from the hardware and have up to nanosecond
      precision (e.g. `2026-11-05T10:00:12.345678901Z`); discipline periods are to the minute
      (e.g. `2026-11-05T07:00Z`).
    - Changes are also pushed to the pages over a WebSocket on the same port (see backend/README.md): this API
      returns the state, the WebSocket tells when it changed.
    - The routes are listed in backend/src/routes/api.ts. `npm test` checks that this file lists the same routes.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3001/api
    description: Local app (the port is set by --port, PORT or port in config.yaml)
# No authentication: the app is used on a local network. Only the sync routes between instances need the sync key
security: []
tags:
  - name: Status
    description: Whether the server runs, and the state of the devices (diagnostics page)
  - name: Events
    description: Events, disciplines, participants and discipline settings, read from the working directory
  - name: Results
    description: Saved runs of a discipline (<event>-<discipline>-results.csv)
  - name: Run
    description: The timed runs, one at a time on each line of a computer
  - name: Live
    description: What this computer and the synced ones are doing
  - name: Device configuration
    description: The device config.yaml at the root of the working directory
  - name: Administration lock
    description: |
      With an `adminPassword` in config.yaml, the pages hide the administration pages and the discipline settings
      until the password is typed. Only the pages are locked, not the API.
  - name: Simulated gates
    description: Gate crossings over HTTP, only when the server is started with `TIMING_SIMULATE_GATES=1`
  - name: Sync
    description: |
      Between instances with the same sync key. Except `GET /sync`, these routes need the hash of the key in the
      `x-timing-sync` header, and answer 403 otherwise.

paths:
  /status:
    get:
      tags: [Status]
      summary: Health check
      operationId: getStatus
      responses:
        '200':
          description: The server is running
          content:
            application/json:
              schema:
                type: object
                required: [status, uptime, timestamp]
                properties:
                  status: { type: string, const: online }
                  uptime: { type: number, description: Seconds since the server started }
                  timestamp: { type: integer, description: 'Server time, milliseconds since the epoch' }

  /hardware/status:
    get:
      tags: [Status]
      summary: Devices, HID interfaces and configuration problems (diagnostics page)
      operationId: getHardwareStatus
      parameters:
        - name: monitor
          in: query
          required: false
          description: >-
            Comma-separated device models (vendorId:productId, as in `interfaces`) to open even though no line uses
            listens to them, so that their reports are shown. They stay open while requests keep asking for them, and
            close 5 seconds after the last one.
          schema: { type: string, examples: ['0x046d:0xc548'] }
      responses:
        '200':
          description: Snapshot of the hardware state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HardwareStatus' }

  /events:
    get:
      tags: [Events]
      summary: Events of the working directory, with their disciplines
      operationId: listEvents
      responses:
        '200':
          description: Every event folder and its discipline subfolders, sorted by name (numbers by value)
          content:
            application/json:
              schema:
                type: object
                required: [workDir, events]
                properties:
                  workDir: { type: string, description: Absolute path of the working directory }
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/EventSummary' }
    post:
      tags: [Events]
      summary: Creates an event
      description: |
        Creates the folder of an event in the working directory, empty. The name is trimmed, and must be a folder name
        on every system (at most 64 characters, none of / \ : * ? " < > |, no dot at the start or end, no name
        reserved by Windows), other than `api`. Pages get an `EVENTS_UPDATE` message. Only the pages hide it while the
        administration is locked.
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewName' }
            example: { name: UNICON22 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event: { type: string, description: The name of the event, trimmed, examples: [UNICON22] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Exists' }
        '422': { $ref: '#/components/responses/Invalid' }

  /events/{event}/disciplines:
    parameters:
      - $ref: '#/components/parameters/Event'
    post:
      tags: [Events]
      summary: Creates a discipline in an event
      description: |
        Creates the folder of a discipline in the event, with a config.yaml of the default settings, so the sync
        copies it to the other computers. Same rules for the name as an event (`api` allowed). Pages get an
        `EVENTS_UPDATE` message. Only the pages hide it while the administration is locked.
      operationId: createDiscipline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewName' }
            example: { name: Slalom }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [event, discipline]
                properties:
                  event: { type: string, examples: [UNICON22] }
                  discipline: { type: string, description: The name of the discipline, trimmed, examples: [Slalom] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Unknown event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }
        '409': { $ref: '#/components/responses/Exists' }
        '422': { $ref: '#/components/responses/Invalid' }

  /events/{event}/{discipline}/participants:
    parameters:
      - $ref: '#/components/parameters/Event'
      - $ref: '#/components/parameters/Discipline'
    get:
      tags: [Events]
      summary: Participants of a discipline, merged from its CSV files
      operationId: getParticipants
      responses:
        '200':
          description: The participants sorted by bib, the discipline settings, and the problems found in its files
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantList' }
        '404': { $ref: '#/components/responses/UnknownDiscipline' }
    post:
      tags: [Events]
      summary: Adds a participant by hand
      description: |
        Adds a row to a participant file of the discipline: the one named in `file`, else its first one. A discipline
        without participant file gets `<event>-<discipline>-competitors.csv`, with a `Bib;Name;Category` header. The
        file keeps its other columns, separator, line endings and encoding (Windows-1252 becomes UTF-8 with a BOM when
        it cannot hold a character); a category in a file without category column adds one. The results are kept. The
        UDA export is written again, the sync copies the file, and pages get a `SYNC_UPDATE` message.
      operationId: addParticipant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ParticipantInput'
                - type: object
                  properties:
                    file: { type: string, description: A participant file of the discipline, examples: [men.csv] }
      responses:
        '201':
          description: Added; the participants as the editor shows them
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditableParticipants' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Unknown event, discipline or file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }
        '409':
          description: The bib is already used
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }
        '422': { $ref: '#/components/responses/Invalid' }

  /events/{event}/{discipline}/participants/editable:
    parameters:
      - $ref: '#/components/parameters/Event'
      - $ref: '#/components/parameters/Discipline'
    get:
      tags: [Events]
      summary: Participants of a discipline as written in their files, to change them by hand
      operationId: getEditableParticipants
      responses:
        '200':
          description: The participant files, and the participants sorted by bib
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditableParticipants' }
        '404': { $ref: '#/components/responses/UnknownDiscipline' }

  /events/{event}/{discipline}/participants/{bib}:
    parameters:
      - $ref: '#/components/parameters/Event'
      - $ref: '#/components/parameters/Discipline'
      - name: bib
        in: path
        required: true
        description: Bib of a participant of the discipline
        schema: { type: string, pattern: '^\d+$', examples: ['7'] }
    put:
      tags: [Events]
      summary: Changes a participant by hand
      description: |
        Rewrites the row of the participant in its file (see `POST /events/{event}/{discipline}/participants`). A
        participant with runs, or ready or running on a line, keeps their bib (409).
      operationId: updateParticipant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantInput' }
      responses:
        '200':
          description: Changed; the participants as the editor shows them
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditableParticipants' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Unknown event, discipline or participant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }
        '409':
          description: The new bib is already used, or the participant has runs and the bib changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Events]
      summary: Removes a participant by hand
      description: |
        Removes the row of the participant from its file (see `POST /events/{event}/{discipline}/participants`). A
        participant with runs, or ready or running on a line, cannot be removed (409).
      operationId: removeParticipant
      responses:
        '200':
          description: Removed; the participants as the editor shows them
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditableParticipants' }
        '404':
          description: Unknown event, discipline or participant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }
        '409':
          description: The participant has runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }

  /events/{event}/{discipline}/settings:
    parameters:
      - $ref: '#/components/parameters/Event'
      - $ref: '#/components/parameters/Discipline'
    get:
      tags: [Events]
      summary: Settings of a discipline, from its config.yaml
      operationId: getDisciplineSettings
      responses:
        '200':
          description: The settings (defaults for what is missing or wrong) and the problems found in the file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsResponse' }
        '404': { $ref: '#/components/responses/UnknownDiscipline' }
    put:
      tags: [Events]
      summary: Saves the settings of a discipline
      description: |
        Rewrites the discipline's config.yaml in a standard layout (comments are not kept, other settings are),
        then returns the settings as read back from it. Pages get them through a `SETTINGS_UPDATE` message.
      operationId: saveDisciplineSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { $ref: '#/components/schemas/DisciplineSettingsInput' }
            example:
              settings: { attempts: 3, start: '2026-11-05T08:00+01:00', end: null, access: auto }
      responses:
        '200':
          description: Saved; the settings as stored (start and end in UTC)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsResponse' }
        '404': { $ref: '#/components/responses/UnknownDiscipline' }
        '422': { $ref: '#/components/responses/Invalid' }

  /events/{event}/{discipline}/files:
    parameters:
      - $ref: '#/components/parameters/Event'
      - $ref: '#/components/parameters/Discipline'
    get:
      tags: [Events]
      summary: Files of a discipline
      description: |
        The participant files (any other CSV file of the folder) and the files the app writes: its results, their UDA
        export and its settings. Other files are left out. Also the backups of its results, each with the participant
        files of that moment, made when its participants changed.
      operationId: listDisciplineFiles
      responses:
        '200':
          description: The files, sorted by name, and the backups, newest first
          content:
            application/json:
              schema:
                type: object
                required: [files, backups]
                properties:
                  files:
                    type: array
                    items: { $ref: '#/components/schemas/DisciplineFile' }
                  backups:
                    type: array
                    items: { $ref: '#/components/schemas/Backup' }
        '404': { $ref: '#/components/responses/UnknownDiscipline' }

  /events/{event}/{discipline}/backups/{backup}/{file}:
    parameters:
      - $ref: '#/components/parameters/Event'
      - $ref: '#/components/parameters/Discipline'
      - name: backup
        in: path
        required: true
        description: Name of a backup of the discipline
        schema: { type: string, examples: [2026-11-05_08-03-09] }
      - name: file
        in: path
        required: true
        description: Name of a file of the backup
        schema: { type: string, examples: [CFM26-100m-results.csv] }
    get:
      tags: [Events]
      summary: Downloads a file of a backup of a discipline
      description: Only the files of the backups listed by `GET /events/{event}/{discipline}/files`.
      operationId: downloadBackupFile
      responses:
        '200':
          description: The file, as an attachment
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          description: Unknown event, discipline, backup or file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }

  /events/{event}/{discipline}/files/{file}:
    parameters:
      - $ref: '#/components/parameters/Event'
      - $ref: '#/components/parameters/Discipline'
      - name: file
        in: path
        required: true
        description: Name of a file of the discipline folder
        schema: { type: string, examples: [men.csv] }
    get:
      tags: [Events]
      summary: Downloads a file of a discipline
      description: Only the files listed by `GET /events/{event}/{discipline}/files`.
      operationId: downloadDisciplineFile
      responses:
        '200':
          description: The file, as an attachment
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          description: Unknown event, discipline or file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }
    put:
      tags: [Events]
      summary: Uploads a participant file
      description: |
        Writes the body, as is, to a participant file of the discipline. A discipline without participant file gets
        it as `<event>-<discipline>-competitors.csv`, whatever the name in the URL; a discipline with participant files only has them
        replaced (409 for another name), a name that differs only in case keeping the file's own. The name must be a
        .csv file name valid on every system, other than the results files. At most 5 MB. New participants reset the
        results: the runs timed so far are saved with the participant files to `backup/<date of their last
        change>/`, then dropped (the results files are removed), on every synced computer (`results-reset.yaml` records when). The UDA export is written again, the sync copies the file, and pages get a
        `SYNC_UPDATE` message. Only the pages hide it while the administration is locked.
      operationId: uploadParticipantFile
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
            example: "bib;name\n7;Hugo Guérin\n"
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedFile' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/UnknownDiscipline' }
        '409':
          description: The discipline has participant files, and none of this name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }
        '422': { $ref: '#/components/responses/Invalid' }

  /events/{event}/{discipline}/results:
    parameters:
      - $ref: '#/components/parameters/Event'
      - $ref: '#/components/parameters/Discipline'
    get:
      tags: [Results]
      summary: Every saved run of a discipline, oldest first
      description: Valid lines without a readable time are left out.
      operationId: getResults
      responses:
        '200':
          description: The runs (empty before the first one)
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/RunResult' }
        '404': { $ref: '#/components/responses/UnknownDiscipline' }
    patch:
      tags: [Results]
      summary: Changes the status of a saved run
      description: |
        The run is identified by its bib and start together. Pages get the change through a `RESULT_UPDATE` message.
      operationId: setResultStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bib, start, status]
              properties:
                bib: { type: string }
                start: { type: string, format: date-time, description: "The run's start, exactly as in the result" }
                status: { $ref: '#/components/schemas/RunStatus' }
      responses:
        '200':
          description: The run with its new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Unknown event or discipline, or the run is not in the results file any more
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }
        '409':
          description: The discipline is closed, or the run has no time and cannot become `ok`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }

  /lines:
    get:
      tags: [Run]
      summary: The lines of this computer, with their runs
      description: |
        The lines of config.yaml, in its order, then the manual line "Manuel" (disciplines timed by hand). With
        simulated gates and no line in config.yaml, two simulated lines, "Line 1" and "Line 2", before it. Pages get the changes through `RUN_UPDATE` and `LINES_UPDATE` messages.
      operationId: getLines
      responses:
        '200':
          description: The name of this computer, and each line with its run and the last run it ended
          content:
            application/json:
              schema:
                type: object
                required: [computer, lines]
                properties:
                  computer:
                    type: string
                    description: |
                      The name of this computer, as written in the `computer` column of the results files: its sync
                      name when sync is on, its host name otherwise
                  lines:
                    type: array
                    items: { $ref: '#/components/schemas/LineRun' }

  /lines/{line}/ready:
    parameters:
      - $ref: '#/components/parameters/Line'
    post:
      tags: [Run]
      summary: A participant is ready on a line
      description: |
        The next start crossing of the line starts their run, its next finish crossing ends it and saves the result.
        In a discipline that measures a distance (`measure: distance`), `distance` is the distance typed by the
        operator: the participant is ready with it until it is validated, invalidated or disqualified.
      operationId: prepareRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, discipline, bib]
              properties:
                event: { type: string }
                discipline: { type: string }
                bib: { type: string }
                distance:
                  type: integer
                  exclusiveMinimum: 0
                  exclusiveMaximum: 100000
                  description: |
                    In centimetres (e.g. 345 for 3.45 m), required for a discipline that measures a distance (ignored
                    otherwise), at least its minDistance
                unlock:
                  type: boolean
                  default: false
                  description: |
                    Exceptionally lets the participant change distance without validating the one they started
                    (a distance discipline without allowDistanceChange)
            example: { event: CFM26, discipline: 100m, bib: '7' }
      responses:
        '200':
          description: The run is ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunState' }
        '404':
          description: Unknown line, event, discipline or participant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }
        '409':
          description: |
            The line is not ready (see LineRun.ready), a run is in progress on the line, the participant is ready or
            running on another line, has no attempt left, the discipline is closed, it is timed by hand or measures a
            distance and the line is not the manual line (or the other way round), the distance is missing or not
            a whole number of centimetres, the participant is eliminated (all the attempts allowed at one distance
            used), or they started another distance and did not validate it yet (unless allowDistanceChange)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }

  /lines/{line}/validate:
    parameters:
      - $ref: '#/components/parameters/Line'
    post:
      tags: [Run]
      summary: Saves the distance a participant is ready with as valid
      description: For a discipline that measures a distance, after the participant got ready with it.
      operationId: validateRun
      responses:
        '200': { $ref: '#/components/responses/Idle' }
        '404': { $ref: '#/components/responses/UnknownLine' }
        '409':
          description: No distance waits to be validated on the line
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }

  /lines/{line}/invalidate:
    parameters:
      - $ref: '#/components/parameters/Line'
    post:
      tags: [Run]
      summary: Ends the running run of a line now and saves it as invalid
      description: |
        An invalid run is not the participant's fault and does not use up an attempt. It has no time. A distance waiting
        to be validated is saved with it.
      operationId: invalidateRun
      responses:
        '200': { $ref: '#/components/responses/Idle' }
        '404': { $ref: '#/components/responses/UnknownLine' }
        '409': { $ref: '#/components/responses/NoRun' }

  /lines/{line}/disqualify:
    parameters:
      - $ref: '#/components/parameters/Line'
    post:
      tags: [Run]
      summary: Ends the running run of a line now and saves it as disqualified (DQ)
      description: A distance waiting to be validated is saved with it.
      operationId: disqualifyRun
      responses:
        '200': { $ref: '#/components/responses/Idle' }
        '404': { $ref: '#/components/responses/UnknownLine' }
        '409': { $ref: '#/components/responses/NoRun' }

  /lines/{line}/key:
    parameters:
      - $ref: '#/components/parameters/Line'
    post:
      tags: [Run]
      summary: The trigger key was pressed on the race page of the manual line
      description: |
        For the disciplines timed by hand (`trigger: keyboard` in their settings), which run on the manual line,
        "Manuel". Timestamped when the request arrives. It is the start crossing of the participant who is ready on the
        line, or the finish crossing of the run in progress (which is saved). With no participant ready, nothing
        changes.
      operationId: pressKey
      responses:
        '200':
          description: The run of the line after the key press
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunState' }
        '404': { $ref: '#/components/responses/UnknownLine' }
        '409':
          description: The line is not the manual line (see LineRun.manual)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }

  /lines/{line}/cancel:
    parameters:
      - $ref: '#/components/parameters/Line'
    post:
      tags: [Run]
      summary: Abandons the ready or running run of a line, nothing is saved
      operationId: cancelRun
      responses:
        '200': { $ref: '#/components/responses/Idle' }
        '404': { $ref: '#/components/responses/UnknownLine' }

  /simulate/crossing:
    post:
      tags: [Simulated gates]
      summary: Fires a gate crossing of a line now
      description: |
        Acts as if the start or finish gate of the line was crossed now. Only when the server is started with
        `TIMING_SIMULATE_GATES=1` (end-to-end tests, training without hardware); the route does not exist otherwise
        (404).
      operationId: simulateCrossing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gate]
              properties:
                gate: { type: string, enum: [start, finish] }
                line: { type: string, description: 'The line, the first enabled one by default', examples: [Line 1] }
      responses:
        '200':
          description: The run of the line after the crossing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/UnknownLine' }
        '409':
          description: The line is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }

  /simulate/reset:
    post:
      tags: [Simulated gates]
      summary: Starts over
      description: |
        Reads config.yaml again (no file: no line, so the simulated lines), and forgets the runs in progress and the
        last results shown on the live pages, as when the app starts. Only with `TIMING_SIMULATE_GATES=1`.
      operationId: simulateReset
      responses:
        '200':
          description: The lines, all idle
          content:
            application/json:
              schema:
                type: object
                required: [lines]
                properties:
                  lines:
                    type: array
                    items: { $ref: '#/components/schemas/LineRun' }

  /live:
    get:
      tags: [Live]
      summary: What this computer and the synced ones are doing (live page)
      operationId: getLive
      responses:
        '200':
          description: This computer first, then the peers whose activity is known
          content:
            application/json:
              schema:
                type: object
                required: [instances]
                properties:
                  instances:
                    type: array
                    items: { $ref: '#/components/schemas/LiveInstance' }

  /config:
    get:
      tags: [Device configuration]
      summary: The device config.yaml, parsed
      operationId: getConfig
      responses:
        '200':
          description: |
            `config` is null when the file is missing (`modifiedAt` null too) or invalid (`problems` says why and
            `content` holds its text).
          content:
            application/json:
              schema:
                type: object
                required: [path, modifiedAt, config, problems]
                properties:
                  path: { type: string, description: Absolute path of config.yaml }
                  modifiedAt:
                    type: [number, 'null']
                    description: Modification time of the file (ms since the epoch), to send back when saving
                  config:
                    oneOf:
                      - $ref: '#/components/schemas/DevicesConfig'
                      - type: 'null'
                  problems: { type: array, items: { type: string } }
                  content: { type: [string, 'null'], description: Text of an invalid file }
    put:
      tags: [Device configuration]
      summary: Saves config.yaml
      description: |
        Writes the config in a standard layout (comments are not kept). The app applies it within a second; the port
        is applied when the app restarts. `modifiedAt` must be the modification time read with GET (null for a new
        file): if the file changed since, nothing is saved (409).
      operationId: saveConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config, modifiedAt]
              properties:
                config: { $ref: '#/components/schemas/DevicesConfig' }
                modifiedAt: { type: [number, 'null'] }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [modifiedAt]
                properties:
                  modifiedAt: { type: number, description: The new modification time }
        '409':
          description: config.yaml was changed by someone else since it was loaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }
        '422': { $ref: '#/components/responses/Invalid' }

  /config/validate:
    post:
      tags: [Device configuration]
      summary: Checks a config without saving it
      description: Always 200; `problems` is empty when the config is valid. Problems of a line start with `lines[<index>]`, of a device with `devices[<index>]`.
      operationId: validateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config: { $ref: '#/components/schemas/DevicesConfig' }
      responses:
        '200':
          description: The problems found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }

  /admin/lock:
    get:
      tags: [Administration lock]
      summary: Whether the administration is locked
      operationId: getAdminLock
      parameters:
        - name: token
          in: query
          required: false
          description: Token returned by `POST /admin/unlock`
          schema: { type: string }
      responses:
        '200':
          description: |
            `protected` is false without `adminPassword` (then `unlocked` is always true). A token stops unlocking when
            the password changes or the app restarts.
          content:
            application/json:
              schema:
                type: object
                required: [protected, unlocked]
                properties:
                  protected: { type: boolean, description: Whether config.yaml has an adminPassword }
                  unlocked: { type: boolean, description: Whether the token unlocks the administration }

  /admin/unlock:
    post:
      tags: [Administration lock]
      summary: Checks the administration password
      operationId: unlockAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: The right password
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string, description: To send to `GET /admin/lock` }
        '401':
          description: Wrong password, or no password set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }

  /sync:
    get:
      tags: [Sync]
      summary: Whether sync is on, and the other computers found
      description: Public, unlike the other sync routes (shown in the page menu).
      operationId: getSyncStatus
      responses:
        '200':
          description: The sync state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncStatus' }

  /sync/manifest:
    get:
      tags: [Sync]
      summary: The event files and results digests this instance offers
      operationId: getSyncManifest
      security: [{ syncKey: [] }]
      responses:
        '200':
          description: The manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manifest' }
        '403': { $ref: '#/components/responses/NotAPeer' }

  /sync/file:
    get:
      tags: [Sync]
      summary: One event file
      operationId: getSyncFile
      security: [{ syncKey: [] }]
      parameters:
        - name: path
          in: query
          required: true
          description: '`<event>/<discipline>/<file>`, a CSV or YAML file other than the results file and its UDA export (<event>-<discipline>-results.csv, <event>-<discipline>-uda-results.csv)'
          schema: { type: string, examples: [CFM26/100m/men.csv] }
      responses:
        '200':
          description: The file as it is on disk
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/NotAPeer' }
        '404':
          description: Not a synced file name, or no such file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }

  /sync/results:
    get:
      tags: [Sync]
      summary: Every line of the results file of a discipline
      operationId: getSyncResults
      security: [{ syncKey: [] }]
      parameters:
        - name: event
          in: query
          required: true
          schema: { type: string }
        - name: discipline
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The lines as written in the results file
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                properties:
                  rows:
                    type: array
                    items: { $ref: '#/components/schemas/ResultRow' }
        '403': { $ref: '#/components/responses/NotAPeer' }
        '404': { $ref: '#/components/responses/UnknownDiscipline' }

  /sync/activity:
    post:
      tags: [Sync]
      summary: A peer's activity changed
      description: A peer pushes its activity (race pages shown, run and last result of each line) as soon as it changes.
      operationId: postSyncActivity
      security: [{ syncKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, activity]
              properties:
                id: { type: string, description: The peer's instance ID }
                activity: { $ref: '#/components/schemas/Activity' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/NotAPeer' }

  /sync/notify:
    post:
      tags: [Sync]
      summary: A peer changed something; this instance pulls from it now
      operationId: postSyncNotify
      security: [{ syncKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: The peer's instance ID }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/NotAPeer' }

components:
  securitySchemes:
    syncKey:
      type: apiKey
      in: header
      name: x-timing-sync
      description: |
        SHA-256 (hex) of `timing-sync\n<key>`, where `<key>` is the sync key of config.yaml. It only keeps instances
        of other events apart: it is not a protection against someone on the network.

  parameters:
    Event:
      name: event
      in: path
      required: true
      description: Name of an event folder of the working directory
      schema: { type: string, examples: [CFM26] }
    Discipline:
      name: discipline
      in: path
      required: true
      description: Name of a discipline folder of the event
      schema: { type: string, examples: [100m] }
    Line:
      name: line
      in: path
      required: true
      description: Name of a line of this computer (URL-encoded), or of a manual line ("Manuel", "Manuel 2"… "Manuel 9")
      schema: { type: string, examples: [Line 1] }

  responses:
    UnknownDiscipline:
      description: Unknown event or discipline
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problems' }
    BadRequest:
      description: Missing or wrong fields in the request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problems' }
    Exists:
      description: A folder of this name exists already (case ignored)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problems' }
    Invalid:
      description: Invalid values; `problems` lists each one
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problems' }
    UnknownLine:
      description: Unknown line
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problems' }
    NoRun:
      description: No run in progress on the line
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problems' }
    NotAPeer:
      description: Sync is off, or the sync key differs
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problems' }
    Idle:
      description: No run in progress any more
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RunState' }
    Ok:
      description: Received
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean, const: true }

  schemas:
    Problems:
      type: object
      required: [problems]
      properties:
        problems:
          type: array
          items: { type: string }
          examples: [['Unknown event or discipline.']]

    DisciplineFile:
      type: object
      required: [name, kind, size, modified]
      properties:
        name: { type: string, examples: [men.csv] }
        kind:
          type: string
          enum: [participants, results, uda, settings]
          description: A participant list, the results, their UDA export, or the settings (config.yaml)
        size: { type: integer, description: Size in bytes }
        modified: { type: string, format: date-time, description: Last change }

    Backup:
      type: object
      required: [name, date, files]
      description: Results saved before the participants of the discipline changed, with their UDA export and the participant files of that moment
      properties:
        name:
          type: string
          description: 'Name of its folder in backup/: the last change of the results saved, local time (a -2, -3... suffix for another backup of that date)'
          examples: [2026-11-05_08-03-09]
        date: { type: [string, 'null'], format: date-time, description: 'That date, null when the name is not one' }
        files:
          type: array
          description: 'The results file (kind results) first, their UDA export (kind uda), then the participant files (kind participants), prefixed by <event>-<discipline>- as the results files; each name suffixed by the name of the backup, e.g. CFM26-100m-men-2026-11-05_08-03-09.csv'
          items: { $ref: '#/components/schemas/DisciplineFile' }

    UploadedFile:
      type: object
      required: [name, created]
      properties:
        name: { type: string, description: 'The name written: <event>-<discipline>-competitors.csv for the first file, else the name of the file replaced' }
        created: { type: boolean, description: Whether the file is new }

    NewName:
      type: object
      required: [name]
      properties:
        name: { type: string, description: Name of the folder to create }

    EventSummary:
      type: object
      required: [name, disciplines]
      properties:
        name: { type: string, examples: [CFM26] }
        disciplines:
          type: array
          items: { type: string }
          examples: [['10km', '100m']]

    Participant:
      type: object
      required: [bib, name, category]
      properties:
        bib: { type: string, pattern: '^\d+$', examples: ['7'] }
        name: { type: string, examples: [Hugo Guérin] }
        category: { type: string, description: 'The Age Group column of the CSV file, empty when it has none or the cell is empty', examples: [Sénior M] }

    NameFields:
      type: object
      description: The name cells of a participant, by name field of their file
      properties:
        name: { type: string, examples: [Hugo Guérin] }
        firstName: { type: string, examples: [Hugo] }
        lastName: { type: string, examples: [GUÉRIN] }

    ParticipantInput:
      type: object
      required: [bib, fields]
      properties:
        bib: { type: string, pattern: '^\d+$', examples: ['7'] }
        fields:
          $ref: '#/components/schemas/NameFields'
          description: The name fields of the file (others are ignored); they must give a name
        category: { type: string, description: Empty for none, examples: [Sénior M] }

    EditableParticipants:
      type: object
      required: [files, participants]
      properties:
        files:
          type: array
          items:
            type: object
            required: [name, nameFields]
            properties:
              name: { type: string, examples: [competitors.csv] }
              nameFields:
                type: array
                description: The name columns of the file
                items: { type: string, enum: [name, firstName, lastName] }
                examples: [[firstName, lastName]]
        participants:
          type: array
          items:
            type: object
            required: [bib, name, category, file, fields, timed]
            properties:
              bib: { type: string, pattern: '^\d+$', examples: ['7'] }
              name: { type: string, description: As shown on the race page, examples: [Hugo Guérin] }
              category: { type: string, examples: [Sénior M] }
              file: { type: string, examples: [competitors.csv] }
              fields:
                $ref: '#/components/schemas/NameFields'
                description: The name cells as written in the file (empty for the fields it does not have)
              timed:
                type: boolean
                description: The participant has runs, or is ready or running on a line, so keeps their bib

    ParticipantList:
      type: object
      required: [participants, settings, problems]
      properties:
        participants:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
        settings: { $ref: '#/components/schemas/DisciplineSettings' }
        problems:
          type: array
          description: Settings that were ignored and CSV rows that were skipped, and why
          items: { type: string }
          examples: [['men.csv, line 3: bib "x" is not a number']]

    Access:
      type: string
      enum: [auto, open, locked]
      description: |
        When runs can be timed and results changed: during the start - end period (auto), always (open) or never
        (locked).

    Best:
      type: string
      enum: [shortest, longest]
      default: shortest
      description: |
        Which time is the best result of a participant, and ranks first: the shortest (a race) or the longest (a slow
        race, where the slowest participant wins).

    Precision:
      type: string
      enum: [second, tenth, hundredth, thousandth]
      default: hundredth
      description: Unit of the measured times (not for a distance, always in centimetres).

    Rounding:
      type: string
      enum: [truncate, nearest, up]
      default: up
      description: |
        How the exact time is brought to the unit of `precision`: truncated, rounded to the nearest (a half goes up)
        or rounded up.

    DisciplineSettings:
      type: object
      required: [measure, attempts, attemptsPerDistance, minDistance, allowDistanceChange, start, end, access, best, precision, rounding, recentRuns, resultRows, trigger, triggerKey]
      properties:
        measure: { $ref: '#/components/schemas/Measure' }
        attempts:
          type: [integer, 'null']
          minimum: 1
          description: |
            Runs allowed per participant (invalid runs do not count). The best result is among the first ones only: a
            run beyond them (e.g. an invalid run made valid afterwards) does not count. null for unlimited
        attemptsPerDistance:
          type: [integer, 'null']
          minimum: 1
          description: |
            For a distance: runs allowed at one same distance (invalid runs do not count). A participant who used them
            all at a distance without validating it is eliminated. null for unlimited. Ignored for a time
        minDistance:
          type: [integer, 'null']
          minimum: 1
          maximum: 99999
          description: |
            For a distance: the shortest distance a participant can try, in centimetres, the one the race page suggests
            before the first run of the line. null for no minimum. Ignored for a time
        allowDistanceChange:
          type: boolean
          default: false
          description: |
            For a distance: whether a participant can change distance before validating the last one they tried (false:
            they try it again until it is validated). Ignored for a time
        start:
          type: [string, 'null']
          description: Start of the period (included), UTC to the minute. null for no limit
          examples: ['2026-11-05T07:00Z']
        end:
          type: [string, 'null']
          description: End of the period (excluded), UTC to the minute. null for no limit
          examples: ['2026-11-05T17:00Z']
        access: { $ref: '#/components/schemas/Access' }
        best: { $ref: '#/components/schemas/Best' }
        precision: { $ref: '#/components/schemas/Precision' }
        rounding: { $ref: '#/components/schemas/Rounding' }
        recentRuns:
          type: integer
          minimum: 0
          description: How many of the last runs of a line the race page shows (0 for none). 3 when not set
        resultRows:
          type: integer
          minimum: 1
          description: |
            How many runs of a participant the race page shows at once, the latest first (the others by scrolling).
            5 when not set
        trigger: { $ref: '#/components/schemas/Trigger' }
        triggerKey: { $ref: '#/components/schemas/TriggerKey' }

    Measure:
      type: string
      enum: [time, distance]
      default: time
      description: |
        What a run measures: a time between the start and finish crossings (time, the default), or a distance typed by
        the operator on the race page (distance: on the manual line "Manuel" of each computer, the longest distance is
        the best, in centimetres; best, precision, rounding and trigger are ignored).

    TriggerKey:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9]{0,31}$'
      description: |
        The key that starts and finishes the runs of a discipline timed by hand, as the KeyboardEvent.code of the
        browser (the key at that place, whatever the layout of the keyboard). Space when not set
      examples: [Space, Enter, KeyA]

    Trigger:
      type: string
      enum: [gates, keyboard]
      description: |
        What starts and finishes the runs: the start and finish gates of a line of config.yaml (gates, the default),
        or a key on the race page (keyboard: timed by hand, on the manual line "Manuel" of each computer, see triggerKey).

    DisciplineSettingsInput:
      type: object
      description: |
        Every field is optional (time for measure, null, auto for access, shortest for best, hundredth for precision, up for rounding, 3 for recentRuns, 5 for resultRows, gates for trigger, Space for triggerKey). start and end accept any ISO 8601 date-time with an offset;
        without an offset they are read in the server's time zone, and a date alone means the start of that day (start)
        or the next midnight (end). The start must be before the end.
      properties:
        measure: { $ref: '#/components/schemas/Measure' }
        attempts: { type: [integer, 'null'], minimum: 1 }
        attemptsPerDistance: { type: [integer, 'null'], minimum: 1 }
        minDistance: { type: [integer, 'null'], minimum: 1, maximum: 99999 }
        allowDistanceChange: { type: boolean }
        start: { type: [string, 'null'], examples: ['2026-11-05T08:00+01:00'] }
        end: { type: [string, 'null'], examples: ['2026-11-05'] }
        access: { $ref: '#/components/schemas/Access' }
        best: { $ref: '#/components/schemas/Best' }
        precision: { $ref: '#/components/schemas/Precision' }
        rounding: { $ref: '#/components/schemas/Rounding' }
        recentRuns: { type: integer, minimum: 0 }
        resultRows: { type: integer, minimum: 1 }
        trigger: { $ref: '#/components/schemas/Trigger' }
        triggerKey: { $ref: '#/components/schemas/TriggerKey' }

    SettingsResponse:
      type: object
      required: [settings, problems]
      properties:
        settings: { $ref: '#/components/schemas/DisciplineSettings' }
        problems: { type: array, items: { type: string } }

    RunStatus:
      type: string
      enum: [ok, invalid, dq]
      description: |
        ok: a valid run. invalid: does not count and does not use up an attempt (not the participant's fault).
        dq: the participant is disqualified for this run.

    RunResult:
      type: object
      required: [bib, name, start, finish, timeMs, distanceCm, status, computer, line]
      properties:
        bib: { type: string, examples: ['7'] }
        name: { type: string, examples: [Hugo Guérin] }
        start: { type: string, format: date-time, examples: ['2026-11-05T10:00:00.123456789Z'] }
        finish:
          type: [string, 'null']
          format: date-time
          description: null when the run was ended before the finish (invalidated or disqualified)
        timeMs:
          type: [integer, 'null']
          description: |
            Finish - start in milliseconds, with the precision and rounding of the discipline settings (e.g. 12350
            for 12.341 s rounded up to the hundredth). null without a finish, and for a distance
          examples: [12345]
        distanceCm:
          type: [integer, 'null']
          description: The distance typed by the operator in centimetres (e.g. 345 for 3.45 m). null for a time
          examples: [345]
        status: { $ref: '#/components/schemas/RunStatus' }
        computer:
          type: [string, 'null']
          description: The computer that timed the run (sync name or host name). null for a run saved before it was recorded
          examples: [Finish line]
        line:
          type: [string, 'null']
          description: The line of that computer that timed the run. null for a run saved before it was recorded
          examples: [Line 1]

    RunState:
      description: The run of a line, told apart by `status`
      oneOf:
        - $ref: '#/components/schemas/RunIdle'
        - $ref: '#/components/schemas/RunReady'
        - $ref: '#/components/schemas/RunRunning'
      discriminator:
        propertyName: status
        mapping:
          idle: '#/components/schemas/RunIdle'
          ready: '#/components/schemas/RunReady'
          running: '#/components/schemas/RunRunning'

    RunIdle:
      type: object
      description: No run in progress
      required: [status]
      properties:
        status: { type: string, const: idle }

    RunReady:
      type: object
      description: |
        A participant is ready, waiting for a start crossing; or, in a discipline that measures a distance, with the
        distance typed by the operator, waiting to be validated
      required: [status, event, discipline, participant]
      properties:
        status: { type: string, const: ready }
        event: { type: string }
        discipline: { type: string }
        participant: { $ref: '#/components/schemas/Participant' }
        distanceCm:
          type: integer
          description: The distance to validate in centimetres, only in a discipline that measures a distance

    RunRunning:
      type: object
      description: The run started, waiting for a finish crossing
      required: [status, event, discipline, participant, startedAt]
      properties:
        status: { type: string, const: running }
        event: { type: string }
        discipline: { type: string }
        participant: { $ref: '#/components/schemas/Participant' }
        startedAt: { type: string, format: date-time, description: Instant of the start crossing }

    LineRun:
      type: object
      description: A line of a computer, with its run
      required: [line, enabled, ready, manual, run, lastResult]
      properties:
        line: { type: string, examples: [Line 1] }
        enabled:
          type: boolean
          description: Whether the line is enabled in config.yaml. A disabled line is listed, but is never ready
        ready:
          type: boolean
          description: |
            Whether the line is enabled and the app listens to the devices of its start and finish, so both
            crossings can be recorded (always true for an enabled line with simulated gates, and for the manual
            line). A participant can only be made ready on a ready line
        manual:
          type: boolean
          description: |
            Whether it is a manual line, listed after the lines of config.yaml on every computer: a line of the
            disciplines timed by hand, started and finished with the space bar of the race page (see
            `POST /lines/{line}/key`), and of those that measure a distance. Each tab of the race page uses its own,
            "Manuel", then "Manuel 2" up to "Manuel 9": "Manuel" is always listed, the others once a run used them
        run: { $ref: '#/components/schemas/RunState' }
        lastResult:
          description: The last run ended on the line, shown until the next participant is ready on it. null for none
          oneOf:
            - type: object
              required: [event, discipline, result, endedAt]
              properties:
                event: { type: string }
                discipline: { type: string }
                result: { $ref: '#/components/schemas/RunResult' }
                endedAt: { type: string, format: date-time }
            - type: 'null'

    Activity:
      type: object
      description: What an instance is doing, shown on the live pages
      required: [viewing, lines]
      properties:
        viewing:
          type: array
          description: Event, discipline and line open on its race pages, with the participant selected there
          items:
            type: object
            required: [event, discipline, line, participant]
            properties:
              event: { type: string }
              discipline: { type: string }
              line: { type: [string, 'null'], description: The line the race page times on }
              participant:
                description: Selected on the race page, not ready yet. null for none
                oneOf:
                  - type: object
                    required: [bib, name]
                    properties:
                      bib: { type: string }
                      name: { type: string }
                  - type: 'null'
        lines:
          type: array
          items: { $ref: '#/components/schemas/LineRun' }

    LiveInstance:
      allOf:
        - $ref: '#/components/schemas/Activity'
        - type: object
          required: [id, name, self, clockOffsetMs]
          properties:
            id: { type: string, description: 'Instance ID, new at each start of the app' }
            name: { type: string, description: 'Sync name of the computer, or its host name' }
            self: { type: boolean, description: Whether it is this computer }
            clockOffsetMs:
              type: number
              description: Its clock minus this computer's clock, to show its running clock right

    ReportPattern:
      type: object
      required: [byteIndex, mask, value]
      description: A button of a device, pressed while `(report[byteIndex] & mask) == value`
      properties:
        reportId: { type: integer, description: Only reports with this report ID (byte 0) }
        byteIndex: { type: integer, minimum: 0 }
        mask: { type: integer, minimum: 0, maximum: 255 }
        value: { type: integer, minimum: 0, maximum: 255 }

    GateRule:
      description: The device button that starts or finishes a line
      allOf:
        - $ref: '#/components/schemas/ReportPattern'
        - type: object
          required: [device]
          properties:
            device: { type: string, description: Name of a device of `devices`, examples: [Receiver] }
            edge:
              type: string
              enum: [press, release]
              description: 'When the crossing is recorded: when the button is pressed (default) or released'

    LineRule:
      type: object
      required: [name, enabled]
      description: |
        A line started and finished by device buttons (`start` and `finish` required), or with the space bar of its race
        page (`trigger: keyboard`, `start` and `finish` ignored)
      properties:
        name: { type: string, description: 'Unique, shown on the race and live pages', examples: [Line 1] }
        enabled: { type: boolean }
        trigger:
          type: string
          enum: [gates, keyboard]
          description: 'What starts and finishes the runs: device buttons (gates, the default) or the space bar'
        start: { $ref: '#/components/schemas/GateRule' }
        finish: { $ref: '#/components/schemas/GateRule' }

    DeviceRule:
      type: object
      required: [name, vendorId, productId]
      properties:
        name: { type: string, description: 'Unique, the lines refer to it', examples: [Receiver] }
        vendorId: { type: integer, examples: [1133] }
        productId: { type: integer, examples: [50504] }
        usagePage: { type: integer, description: 'HID interface to use, with usage (overrides discoveryFilter)' }
        usage: { type: integer }
        serialNumber: { type: string, description: Only the unit with this serial number }
        usbPort: { type: string, description: Only the device on this USB port (Linux), examples: ['3-5'] }
        logReports: { type: boolean, description: Log every changed raw report }

    DevicesConfig:
      type: object
      required: [devices]
      description: The device config.yaml. Field reference in backend/README.md
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Port of the app, read at startup (--port and PORT take precedence)
        sync:
          type: object
          required: [key]
          description: Sync with the instances on the network that have the same key
          properties:
            key: { type: [string, number], examples: [amber-otter-glide] }
            name: { type: string, description: Shown to the other computers (the host name by default) }
        adminPassword:
          type: string
          minLength: 1
          description: Hides the administration pages and the discipline settings until it is typed
        discoveryFilter:
          type: object
          required: [usagePage, usage]
          description: Default HID interface for the rules without usagePage and usage (1 / 2 is a mouse)
          properties:
            usagePage: { type: integer }
            usage: { type: integer }
        lines:
          type: array
          description: The timing lines. Missing for none
          items: { $ref: '#/components/schemas/LineRule' }
        devices:
          type: array
          description: The devices; only those used by an enabled line are opened
          items: { $ref: '#/components/schemas/DeviceRule' }

    RecentReport:
      type: object
      required: [at, reportId, hex, changes, bits]
      properties:
        at: { type: string, format: date-time }
        reportId: { type: [integer, 'null'] }
        hex: { type: string }
        changes:
          type: array
          items: { type: string }
          examples: [['byte 1 bit 0 ↑ (mask 0x01)']]
        bits:
          type: array
          description: The same changes; empty for the first report with this report ID
          items:
            type: object
            required: [byteIndex, bit, isSet]
            properties:
              byteIndex: { type: integer }
              bit: { type: integer, minimum: 0, maximum: 7 }
              isSet: { type: boolean, description: New state of the bit }

    HardwareStatus:
      type: object
      required: [platform, configPath, configValid, devices, interfaces, lastScanAt, unmatchedRules]
      properties:
        platform: { type: string, description: Node.js platform, examples: [linux, win32] }
        configPath: { type: string }
        configValid: { type: boolean }
        devices:
          type: array
          description: Configured devices that are open (listening) or cannot be opened or read (failing)
          items:
            type: object
            required: [deviceName, path, state, since]
            properties:
              deviceName: { type: string }
              path: { type: string, description: OS path of the HID interface }
              state: { type: string, enum: [listening, failing] }
              since: { type: string, format: date-time }
              reportCount: { type: integer }
              numberedReports: { type: boolean, description: Whether byte 0 of its reports is a report ID }
              lastReportAt: { type: string, format: date-time }
              lastReportHex: { type: string, examples: ['01 00 00 00'] }
              recentReports:
                type: array
                description: The last 50 reports that differ from the previous one with the same report ID
                items: { $ref: '#/components/schemas/RecentReport' }
              triggers:
                type: array
                description: The gates of the lines that use this device
                items:
                  allOf:
                    - $ref: '#/components/schemas/ReportPattern'
                    - type: object
                      required: [line, gate, edge, isMatched]
                      properties:
                        line: { type: string }
                        gate: { type: string, enum: [start, finish] }
                        edge: { type: string, enum: [press, release] }
                        isMatched: { type: boolean, description: Whether its pattern matches now (pressed) }
              error: { type: string }
              hint: { type: string }
              attempts: { type: integer, description: Opening attempts so far }
        interfaces:
          type: array
          description: Every HID interface found by the last scan
          items:
            type: object
            required: [path, vendorId, productId, manufacturer, product, serialNumber, usbPort, interfaceNumber, usages, osOwned, transport, rules]
            properties:
              path: { type: string }
              vendorId: { type: string, examples: ['0x046d'] }
              productId: { type: string, examples: ['0xc548'] }
              manufacturer: { type: string }
              product: { type: string }
              serialNumber: { type: string }
              usbPort: { type: [string, 'null'] }
              interfaceNumber: { type: integer }
              usages:
                type: array
                items: { type: string }
                examples: [['1/2 (Mouse)']]
              osOwned: { type: boolean, description: 'A mouse or keyboard, not readable on Windows and macOS' }
              transport:
                type: string
                enum: [hid, usb]
                description: >-
                  usb: read over USB with libusb (path "usb:<bus>-<ports>:<interface>"), because the OS HID driver does
                  not handle this interface, e.g. after installing the WinUSB driver with Zadig on Windows
              rules:
                type: array
                items:
                  type: object
                  required: [name, used, conflict]
                  properties:
                    name: { type: string }
                    used: { type: boolean, description: An enabled line uses this device }
                    conflict: { type: boolean, description: Another interface already uses this rule }
              monitor:
                description: >-
                  Only on the interfaces of a device model asked for with the `monitor` parameter that no used device
                  listens to: opened for the diagnostics page only (it fires no race event)
                type: object
                required: [state, since]
                properties:
                  state: { type: string, enum: [listening, failing] }
                  since: { type: string, format: date-time }
                  reportCount: { type: integer }
                  numberedReports: { type: boolean, description: Whether byte 0 of its reports is a report ID }
                  lastReportAt: { type: string, format: date-time }
                  lastReportHex: { type: string, examples: ['01 00 00 00'] }
                  recentReports:
                    type: array
                    description: The last 50 reports that differ from the previous one with the same report ID
                    items: { $ref: '#/components/schemas/RecentReport' }
                  error: { type: string }
                  hint: { type: string }
                  attempts: { type: integer, description: Opening attempts so far }
        lastScanAt: { type: [string, 'null'], format: date-time }
        unmatchedRules:
          type: array
          description: Why each device used by an enabled line matches no connected device
          items: { type: string }

    SyncStatus:
      type: object
      required: [enabled, name, peers]
      properties:
        enabled: { type: boolean }
        name: { type: [string, 'null'], description: "This computer's sync name, null when sync is off" }
        peers:
          type: array
          items:
            type: object
            required: [name, address, port, lastSeen, lastSyncAt, error, clockOffsetMs]
            properties:
              name: { type: string }
              address: { type: string }
              port: { type: integer }
              lastSeen: { type: string, format: date-time }
              lastSyncAt: { type: [string, 'null'], format: date-time }
              error: { type: [string, 'null'], description: Why the last sync with it failed }
              clockOffsetMs: { type: [number, 'null'], description: Its clock minus this computer's clock }

    Manifest:
      type: object
      required: [protocol, serverTime, files, results]
      properties:
        protocol: { type: string, const: timing-sync/4 }
        serverTime: { type: string, format: date-time }
        files:
          type: array
          items:
            type: object
            required: [path, mtimeMs, hash]
            properties:
              path: { type: string, examples: [CFM26/100m/men.csv] }
              mtimeMs: { type: number }
              hash: { type: string, description: 'SHA-256 of the content, hex' }
        results:
          type: array
          items:
            type: object
            required: [event, discipline, digest]
            properties:
              event: { type: string }
              discipline: { type: string }
              digest: { type: string, description: 'SHA-256 of its lines in a fixed order, hex' }

    ResultRow:
      type: object
      description: A line of the results file as written (text columns)
      required: [bib, name, start, finish, status, computer, line, updated]
      properties:
        bib: { type: string }
        name: { type: string }
        start: { type: string }
        finish: { type: string, description: Empty without a finish }
        status: { type: string, examples: [OK, INVALID, DQ] }
        computer: { type: string, description: The computer that timed the run, empty for older runs }
        line: { type: string, description: The line of that computer that timed the run, empty for older runs }
        updated: { type: string, description: When the line was last changed (UTC); the latest change wins }
